    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-bun-package.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0
    with:
      build-command: bun run test:package
