---
name: Check

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-bun-package.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      build-command: bun run test:package
