jobs:
  general:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@6ce8cef6b4b8e08d6f2117bc9692348cdd1c643f # master

  skills:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@6ce8cef6b4b8e08d6f2117bc9692348cdd1c643f # master
    with:
      skill-roots: skills
