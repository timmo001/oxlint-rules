min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.5"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.10"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install package dependencies"
run = "bun install"

[tasks.test]
description = "Run package tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint maintained code against the fresh local plugin build"
depends = ["build"]
run = "bun run lint:oxlint"

[tasks.typecheck]
description = "Type-check package source against the built package"
depends = ["build"]
run = "bun run typecheck"

[tasks."format:check"]
description = "Check package formatting"
depends = ["install"]
run = "bun run format:check"

[tasks.format]
description = "Format package source and documentation"
depends = ["install"]
run = "bun run format"

[tasks."skills:validate"]
description = "Validate packaged Agent Skills"
depends = ["install"]
run = "bun run skills:validate"

[tasks.check]
description = "Test, lint, type-check, format-check and validate skills"
depends = ["test", "lint", "typecheck", "format:check", "skills:validate"]

[tasks.build]
description = "Build portable ESM package entry points"
depends = ["install"]
run = "bun run build"

[tasks."test:package"]
description = "Test packed rules with the pinned latest Oxlint toolchain"
depends = ["install"]
run = "bun run test:package"
